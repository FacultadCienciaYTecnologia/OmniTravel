<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OmniTravel - Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- CryptoJS para cifrar contraseñas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    
    <style>
        body { background: var(--paper); }
    </style>
</head>
<body class="flex-center">

    <div class="container animate" style="width: 100%; max-width: 450px;">
        <div class="card">
            <div class="text-center mb-3">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 0.5rem;">
                    <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"></path>
                    <circle cx="7" cy="17" r="2"></circle>
                    <path d="M9 17h6"></path>
                    <circle cx="17" cy="17" r="2"></circle>
                </svg>
                <span class="kicker">Transporte institucional</span>
                <h1 style="font-size:1.8rem;">OmniTravel</h1>
                <p>Ingrese con su correo o documento y su contraseña.</p>
            </div>

            <!-- Login por correo y contraseña -->
            <form id="login-email">
                <label>Correo Electrónico o Documento de Identificación</label>
                <input type="text" id="email" placeholder="ejemplo@gmail.com" required>
                
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
                
                <button type="submit" id="btn-login-email" class="btn mt-2">Ingresar al Sistema</button>
            </form>

            <div class="text-center mt-3">
                <p style="font-size:0.9rem; color:var(--text-muted);">¿No estás registrado? <a href="registro.html" style="color:var(--accent); font-weight:700; text-decoration:none;">Crear cuenta aquí</a></p>
            </div>
        </div>
    </div>

    <!-- Archivos JS -->
    <script src="supabase.js"></script>
    <script src="app.js"></script>
    <script>
        // === AUTO LOGIN (Sesión de 24 horas) ===
        function avisoMantenimientoLogin() {
            if (document.getElementById('pantalla-mantenimiento')) return;
            const capa = document.createElement('div');
            capa.id = 'pantalla-mantenimiento';
            capa.setAttribute('role', 'alert');
            capa.style.cssText = 'position:fixed;inset:0;z-index:200000;background:#0c2340;color:#fff;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;font-family:"Source Sans 3",sans-serif;';
            capa.innerHTML = '<div style="max-width:440px;"><p style="letter-spacing:.08em;text-transform:uppercase;color:#d4c4a8;font-weight:700;margin:0 0 12px;">OmniTravel</p><h1 style="font-size:1.8rem;margin:0 0 12px;">Página en mantenimiento</h1><p style="margin:0;line-height:1.5;color:#d5dde6;">El sistema está cerrado temporalmente. Vuelva a intentar más tarde.</p></div>';
            document.body.appendChild(capa);
        }

        async function sitioEnMantenimiento() {
            const { data } = await window.db.from('usuarios').select('id').eq('departamento', '__mantenimiento__').limit(1);
            return !!(data && data.length);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const userStr = localStorage.getItem('omni_user');
            const sessionTime = localStorage.getItem('omni_session_time');
            
            if (userStr && sessionTime) {
                const now = Date.now();
                const diffHoras = (now - parseInt(sessionTime)) / (1000 * 60 * 60);
                
                if (diffHoras < 24) {
                    const data = JSON.parse(userStr);
                    if (data.rol !== 'superadmin') {
                        const { data: fresco } = await window.db.from('usuarios').select('rol, estado_aprobacion').eq('id', data.id).maybeSingle();
                        if (!fresco || (fresco.rol !== 'superadmin' && fresco.rol !== 'admin' && fresco.estado_aprobacion !== 'aprobado')) {
                            localStorage.removeItem('omni_user');
                            localStorage.removeItem('omni_session_time');
                            Swal.fire('Cuenta en revisión', 'Su cuenta aún no ha sido aprobada por la administración.', 'warning');
                            return;
                        }
                        if (fresco.rol === 'admin') {
                            await window.db.from('usuarios').update({ rol: 'superadmin' }).eq('id', data.id);
                            fresco.rol = 'superadmin';
                        }
                        if (fresco.rol !== 'superadmin' && await sitioEnMantenimiento()) {
                            avisoMantenimientoLogin();
                            return;
                        }
                        data.rol = fresco.rol;
                        localStorage.setItem('omni_user', JSON.stringify(data));
                    }
                    if (data.rol === 'superadmin') window.location.href = 'superadmin.html';
                    else window.location.href = 'estudiante.html';
                } else {
                    localStorage.removeItem('omni_user');
                    localStorage.removeItem('omni_session_time');
                }
            }
        });

        // ====== LOGIN POR CORREO Y CONTRASEÑA ======
        document.getElementById('login-email').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login-email');
            btn.disabled = true;
            btn.innerText = "Verificando...";

            const emailInput = document.getElementById('email').value.trim();
            const emailLower = emailInput.toLowerCase();
            const passwordStr = document.getElementById('password').value;
            const hashedPassword = CryptoJS.SHA256(passwordStr).toString();

            try {
                // Buscar por email en minúsculas o por DNI/Documento
                const { data, error } = await window.db
                    .from('usuarios')
                    .select('*')
                    .or(`email.eq.${emailLower},dni.eq.${emailInput}`)
                    .eq('password', hashedPassword)
                    .maybeSingle();

                if (error) throw error;

                if (data) {
                    if (data.rol === 'admin') {
                        await window.db.from('usuarios').update({ rol: 'superadmin' }).eq('id', data.id);
                        data.rol = 'superadmin';
                    }
                    if (data.rol !== 'superadmin' && await sitioEnMantenimiento()) {
                        avisoMantenimientoLogin();
                        btn.disabled = false;
                        btn.innerText = "Ingresar al Sistema";
                        return;
                    }
                    // Si no es superadministrador, verificar aprobación
                    if (data.rol !== 'superadmin' && data.estado_aprobacion !== 'aprobado') {
                        Swal.fire('Cuenta en revisión', 'Su cuenta aún no ha sido aprobada por la administración.', 'warning');
                        btn.disabled = false;
                        btn.innerText = "Ingresar al Sistema";
                        return;
                    }

                    // Guardar sesión y timestamp (24 horas)
                    localStorage.setItem('omni_user', JSON.stringify(data));
                    localStorage.setItem('omni_session_time', Date.now().toString());
                    
                    Swal.fire({ icon: 'success', title: '¡Bienvenido!', text: `Hola, ${data.nombre_completo}`, timer: 1500, showConfirmButton: false }).then(() => {
                        if (data.rol === 'superadmin') window.location.href = 'superadmin.html';
                        else window.location.href = 'estudiante.html';
                    });
                } else {
                    Swal.fire('Denegado', 'Credenciales incorrectas.', 'error');
                    btn.disabled = false;
                    btn.innerText = "Ingresar al Sistema";
                }
            } catch (err) {
                console.error(err);
                Swal.fire('Error', 'No se pudo conectar con el servidor.', 'error');
                btn.disabled = false;
                btn.innerText = "Ingresar al Sistema";
            }
        });
    </script>
</body>
</html>
