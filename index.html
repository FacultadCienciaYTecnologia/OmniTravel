<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OmniTravel - Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth-session.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- CryptoJS para cifrar contraseñas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    
    <style>
        body { background: var(--paper); }
    </style>
</head>
<body class="flex-center">

    <div class="container animate" style="width: 100%; max-width: 450px;">
        <div class="card">
            <div class="text-center mb-3">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 0.5rem;">
                    <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"></path>
                    <circle cx="7" cy="17" r="2"></circle>
                    <path d="M9 17h6"></path>
                    <circle cx="17" cy="17" r="2"></circle>
                </svg>
                <span class="kicker">Transporte institucional</span>
                <h1 style="font-size:1.8rem;">OmniTravel</h1>
                <p>Ingrese con su correo o documento y su contraseña.</p>
            </div>

            <!-- Login por correo y contraseña -->
            <form id="login-email">
                <label>Correo Electrónico o Documento de Identificación</label>
                <input type="text" id="email" placeholder="ejemplo@gmail.com" autocomplete="username" required>
                
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                
                <button type="submit" id="btn-login-email" class="btn mt-2">Ingresar al Sistema</button>
            </form>

            <div class="text-center mt-3">
                <p style="font-size:0.9rem; color:var(--text-muted);">¿No estás registrado? <a href="registro.html" style="color:var(--accent); font-weight:700; text-decoration:none;">Crear cuenta aquí</a></p>
            </div>
        </div>
    </div>

    <!-- Archivos JS -->
    <script src="supabase.js"></script>
    <script src="auth.js"></script>
    <script src="login.js"></script>

</body>
</html>
