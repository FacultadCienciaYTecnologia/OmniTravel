<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OmniTravel - Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Face API -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    
    <style>
        .login-modes { display: flex; border: 1px solid var(--card-border); border-radius: var(--radius-md); overflow: hidden; margin-bottom: 1.5rem; }
        .login-mode-btn { flex: 1; padding: 0.8rem; background: transparent; border: none; font-weight: 600; cursor: pointer; color: var(--text-muted); transition: var(--transition); border-radius: 0; }
        .login-mode-btn.active { background: var(--accent); color: white; }
        #login-face { display: none; }
    </style>
</head>
<body class="flex-center" style="background: linear-gradient(135deg, #f8fafc, #e2e8f0);">

    <div class="container animate" style="width: 100%; max-width: 450px;">
        <div class="card">
            <div class="text-center mb-3">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 0.5rem;">
                    <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"></path>
                    <circle cx="7" cy="17" r="2"></circle>
                    <path d="M9 17h6"></path>
                    <circle cx="17" cy="17" r="2"></circle>
                </svg>
                <h1 style="font-size:1.8rem;">OmniTravel</h1>
                <p>Sistema Inteligente de Transporte</p>
            </div>

            <!-- Tabs para modo de login -->
            <div class="login-modes">
                <button class="login-mode-btn active" onclick="switchLogin('email')">Contraseña</button>
                <button class="login-mode-btn" onclick="switchLogin('face')">Face ID</button>
            </div>

            <!-- Login por Email -->
            <form id="login-email">
                <label>Correo Electrónico o Documento de Identificación</label>
                <input type="text" id="email" placeholder="ejemplo@gmail.com" required>
                
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
                
                <button type="submit" id="btn-login-email" class="btn mt-2">Ingresar al Sistema</button>
            </form>

            <!-- Login por Face ID -->
            <div id="login-face" class="text-center">
                <p class="text-muted mb-2 text-sm">Ubica tu rostro en el centro para iniciar sesión.</p>
                <div class="face-scanner mb-2">
                    <video id="video-login" autoplay muted playsinline></video>
                    <div class="face-overlay" id="overlay-login"></div>
                    <canvas id="canvas-overlay" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></canvas>
                </div>
                <button type="button" class="btn btn-outline" id="btn-start-face" onclick="startFaceLogin()">Activar Face ID</button>
                <p id="face-status" class="mt-2" style="font-weight: 600; color: var(--text-main); font-size: 0.9rem;"></p>
            </div>
            
            <div class="text-center mt-3">
                <p style="font-size:0.9rem; color:var(--text-muted);">¿No estás registrado? <a href="registro.html" style="color:var(--accent); font-weight:700; text-decoration:none;">Crear cuenta aquí</a></p>
            </div>
        </div>
    </div>

    <!-- Archivos JS -->
    <script src="supabase.js"></script>
    <script src="app.js"></script>
    <script>
        // === AUTO LOGIN (Sesión de 24 horas) ===
        document.addEventListener('DOMContentLoaded', () => {
            const userStr = localStorage.getItem('omni_user');
            const sessionTime = localStorage.getItem('omni_session_time');
            
            if (userStr && sessionTime) {
                const now = Date.now();
                const diffHoras = (now - parseInt(sessionTime)) / (1000 * 60 * 60);
                
                if (diffHoras < 24) {
                    const data = JSON.parse(userStr);
                    // Redirigir silenciosamente
                    if (data.rol === 'superadmin') window.location.href = 'superadmin.html';
                    else if (data.rol === 'admin') window.location.href = 'admin.html';
                    else window.location.href = 'estudiante.html';
                } else {
                    // Sesión expirada, limpiar
                    localStorage.removeItem('omni_user');
                    localStorage.removeItem('omni_session_time');
                }
            }
        });

        // Lógica visual de las pestañas
        function switchLogin(mode) {
            document.querySelectorAll('.login-mode-btn').forEach(btn => btn.classList.remove('active'));
            if(mode === 'email') {
                document.querySelector('.login-mode-btn:nth-child(1)').classList.add('active');
                document.getElementById('login-email').style.display = 'flex';
                document.getElementById('login-face').style.display = 'none';
                stopCamera();
            } else {
                document.querySelector('.login-mode-btn:nth-child(2)').classList.add('active');
                document.getElementById('login-email').style.display = 'none';
                document.getElementById('login-face').style.display = 'block';
            }
        }

        // ====== LOGIN POR EMAIL ======
        document.getElementById('login-email').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login-email');
            btn.disabled = true;
            btn.innerText = "Verificando...";

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                // Buscar por email o DNI
                const { data, error } = await window.db
                    .from('usuarios')
                    .select('*')
                    .or(`email.eq.${email},dni.eq.${email}`)
                    .eq('password', password)
                    .maybeSingle();

                if (error) throw error;

                if (data) {
                    // Si es estudiante o admin, verificar aprobación
                    if (data.rol !== 'superadmin' && data.estado_aprobacion !== 'aprobado') {
                        Swal.fire('Cuenta en Revisión', 'Tu cuenta aún no ha sido aprobada por la administración.', 'warning');
                        btn.disabled = false;
                        btn.innerText = "Ingresar al Sistema";
                        return;
                    }

                    // Guardar sesión y timestamp (24 horas)
                    localStorage.setItem('omni_user', JSON.stringify(data));
                    localStorage.setItem('omni_session_time', Date.now().toString());
                    
                    Swal.fire({ icon: 'success', title: '¡Bienvenido!', text: `Hola, ${data.nombre_completo}`, timer: 1500, showConfirmButton: false }).then(() => {
                        if (data.rol === 'superadmin') window.location.href = 'superadmin.html';
                        else if (data.rol === 'admin') window.location.href = 'admin.html';
                        else window.location.href = 'estudiante.html';
                    });
                } else {
                    Swal.fire('Denegado', 'Credenciales incorrectas.', 'error');
                    btn.disabled = false;
                    btn.innerText = "Ingresar al Sistema";
                }
            } catch (err) {
                console.error(err);
                Swal.fire('Error', 'No se pudo conectar con el servidor.', 'error');
                btn.disabled = false;
                btn.innerText = "Ingresar al Sistema";
            }
        });
    </script>
</body>
</html>
